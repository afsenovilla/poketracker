name: Actualizar datos de Pokémon

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 1 * *'

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerar datos
        run: bash scripts/update-data.sh

      - name: Guardar cambios y republicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- public/data; then
            echo "Los datos no han cambiado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data
          git commit -m "Actualizar datos de Pokémon"
          git push
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
